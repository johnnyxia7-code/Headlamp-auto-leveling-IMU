[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "headlamp-leveling"
version = "0.1.0"
description = "IMU-based automatic headlamp leveling: vehicle pitch simulator, dataset generator and model training"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "pyyaml>=6.0",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
export = ["onnx>=1.14"]

[project.scripts]
hal = "headlamp_leveling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
