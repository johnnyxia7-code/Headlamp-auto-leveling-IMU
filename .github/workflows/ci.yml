name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Smoke pipeline
        run: |
          hal generate -c configs/quick.yaml
          hal train -c configs/quick.yaml --epochs 1
          hal evaluate runs/quick/model.pt
          hal export runs/quick/model.pt --no-onnx
          hal fuse-eval -c configs/quick.yaml -n 2 -o runs/quick_fusion
